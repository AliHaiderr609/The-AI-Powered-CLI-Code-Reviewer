[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reviewer"
version = "0.2.0"
description = "CLI that reviews git diffs with OpenAI for security and refactoring advice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Reviewer Contributors" }]
dependencies = [
  "openai>=1.40.0",
  "click>=8.1.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-reviewer = "ai_reviewer.cli:main"

[tool.setuptools.packages.find]
include = ["ai_reviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
