name: AI Reviewer CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # Optional live review — only runs when OPENAI_API_KEY is configured
  review-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Review PR diff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret not set; skipping live review."
            exit 0
          fi
          ai-reviewer --base "origin/${{ github.base_ref }}" \
            --format markdown \
            --output review.md \
            --fail-on critical
      - name: Upload review artifact
        if: hashFiles('review.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: review.md
